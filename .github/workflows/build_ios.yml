name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build:
    name: Build iOS Release Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (No Codesign for CI test)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS Build Output
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r zipbiz-ios-app.ipa Payload

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipbiz-ios-package
          path: build/ios/iphoneos/zipbiz-ios-app.ipa
          retention-days: 30
